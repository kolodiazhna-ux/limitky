name            = "limitky-api"
main            = "src/index.js"
compatibility_date = "2024-12-01"
# Produkčný účet: kolodiazhna@dajanarodriguez.com → limitky-api.kolodiazhna.workers.dev
account_id      = "a1f8ace24040806c01beedb1b4920450"

# ─── Static site (Sklad/Inventár frontend) ──────────────────────────────────
# Worker serves files from ../inventory for any request that matches a file.
# Requests that don't match a file (e.g. /api/*) fall through to src/index.js.
[assets]
directory = "../inventory"

# ─── D1 Database ──────────────────────────────────────────────────────────────
[[d1_databases]]
binding      = "DB"
database_name = "limitky"
database_id  = "43f6c13e-0ad0-4e43-b32b-dd36f942744a"

# ─── R2 Bucket ────────────────────────────────────────────────────────────────
# DISABLED until R2 is enabled in the Cloudflare Dashboard (Dashboard → R2 → Enable).
# Once enabled, run:  npx wrangler r2 bucket create limitky-photos
# then uncomment the 3 lines below and redeploy. Needed only for photo upload to R2.
# [[r2_buckets]]
# binding     = "PHOTOS"
# bucket_name = "limitky-photos"

# ─── Secrets (set via: wrangler secret put API_SECRET) ───────────────────────
# API_SECRET — voliteľný API kľúč, nastav cez: wrangler secret put API_SECRET

# ─── CORS origins ─────────────────────────────────────────────────────────────
[vars]
ALLOWED_ORIGIN = "*"
